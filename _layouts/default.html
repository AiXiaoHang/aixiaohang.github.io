<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial
scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ 
site.title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <!-- ===== 顶部横幅 ===== -->
    <div class="banner">
        <h1>{{ site.title }}</h1>
        {% if site.description %}
            <p>{{ site.description }}</p>
        {% endif %}
    </div>
    <!-- ===== ⽂章列表（含⽇期） ===== -->
    <div class="post-list">
        {% for post in site.posts %}
    <div class="post-item" style="display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid #eee; padding: 10px 0;">
      
      <!-- 左侧：文章链接和标题（增加了不允许换行的样式） -->
      <div class="post-title" style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
        <a href="{{ post.url }}" style="text-decoration: none; color: #333; font-weight: bold;">
          {{ post.title }}
        </a>
      </div>

      <!-- 右侧：日期（保持右对齐） -->
      <div class="post-meta" style="flex-shrink: 0; color: #666;">
        {{ post.date | date: "%B %-d, %Y" }}
      </div>

    </div>
  {% endfor %}
    </div>
</body>
</html>
