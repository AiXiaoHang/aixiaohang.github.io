<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial
scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ 
site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl 
}}/assets/css/style.css">
</head>
<body>
    <!-- ===== 顶部横幅 ===== -->
    <div class="banner">
        <h1>{{ site.title }}</h1>
        {% if site.description %}
            <p>{{ site.description }}</p>
        {% endif %}
    </div>
    <!-- ===== ⽂章列表（含⽇期） ===== -->
    <div class="post-list">
        {% for post in site.posts %}
            <div class="post-item">
                <a href="{{ post.url | prepend: site.baseurl }}">
{{ post.title }}</a>
                <span class="post-meta">{{ post.date | date: "%B 
%-d, %Y" }}</span>
            </div>
        {% endfor %}
    </div>
</body>
</html>
